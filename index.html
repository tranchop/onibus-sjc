<style>
/* Layout: cabeçalho da linha, controles, dois cartões de próximas partidas (Centro azul / Bairro vermelho, as cores dos mapas do PDF), grade por hora, itinerário recolhido. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --fg:#13212f; --muted:#586878; --line:#d8e0e8;
  --centro:#1c2a8f; --centro-bg:#e7eafb; --bairro:#c4281f; --bairro-bg:#fbe8e6;
  --uv:#1b6b44; --uv-bg:#dff3e8; --ac:#8a5a00; --ac-bg:#fbefd2;
  --on-dir:#ffffff;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-num:'Barlow Condensed','Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e151c; --surface:#16202a; --fg:#e7eef5; --muted:#92a3b4; --line:#263340;
    --centro:#98a4ff; --centro-bg:#1b2150; --bairro:#ff8f86; --bairro-bg:#442220;
    --uv:#7fdcaa; --uv-bg:#163a2a; --ac:#f1c25c; --ac-bg:#423213;
    --on-dir:#0e151c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#16202a; --fg:#e7eef5; --muted:#92a3b4; --line:#263340;
  --centro:#98a4ff; --centro-bg:#1b2150; --bairro:#ff8f86; --bairro-bg:#442220;
  --uv:#7fdcaa; --uv-bg:#163a2a; --ac:#f1c25c; --ac-bg:#423213;
  --on-dir:#0e151c; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--centro);outline-offset:2px}

header.top{display:flex;gap:14px;align-items:center}
.num{font-family:var(--font-num);font-weight:700;font-size:38px;line-height:1;background:var(--centro);color:var(--on-dir);
  padding:6px 12px 4px;border-radius:8px;letter-spacing:.5px}
.lines{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:-8px;scroll-snap-type:x proximity}
.lines::-webkit-scrollbar{display:none}
.lines button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 14px;cursor:pointer;font-family:var(--font-num);font-weight:700;font-size:24px;line-height:1.1;letter-spacing:.5px;flex:none;min-height:44px;scroll-snap-align:center}
.lines button[aria-pressed="true"]{background:var(--centro);color:var(--on-dir);border-color:var(--centro)}
.lines button.ag{font-family:var(--font-body);font-size:16px;font-weight:600;letter-spacing:0;padding:4px 16px}
.ov{display:flex;flex-direction:column}
.ovr{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 0;margin:0;border:0;background:none;text-align:left;cursor:pointer;color:inherit}
.ovw{display:flex;align-items:center;border-top:1px solid var(--line)}
.ovw:first-child{border-top:0}
.ovr{flex:1;min-width:0}
.star{flex:none;width:44px;height:44px;background:none;border:0;cursor:pointer;font-size:24px;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--ac)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ch .star{margin:-8px -8px 0 0}
.ovbar{display:flex;flex-wrap:wrap;gap:8px}
.ovr .n{font-family:var(--font-num);font-weight:700;font-size:24px;line-height:1;background:var(--fg);color:var(--bg);border-radius:6px;padding:5px 0 3px;text-align:center}
.ovr .d{display:flex;flex-direction:column;min-width:0}
.ovr .d b{font-weight:600}
.ovr .d span{font-size:12px;color:var(--muted)}
.ovr .tr{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ovr .t{font-family:var(--font-num);font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.ovr .t.c{color:var(--centro)} .ovr .t.b{color:var(--bairro)}
.ovr .r{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.fqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.fq{display:flex;flex-direction:column;gap:10px;min-width:0;border-top:1px solid var(--line);padding-top:10px}
.fq h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.fq.c h3{color:var(--centro)} .fq.b h3{color:var(--bairro)}
.bars{display:flex;align-items:stretch;gap:2px;height:76px}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.bars .col{flex:1;width:100%;min-height:0;display:flex;align-items:flex-end}
.bars i{display:block;width:100%;min-height:2px;border-radius:2px 2px 0 0}
.fq.c .bars i{background:var(--centro)} .fq.b .bars i{background:var(--bairro)}
.bars .b span{font-size:10px;line-height:10px;height:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.bands{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;font-size:14px;font-variant-numeric:tabular-nums}
.bands .k{color:var(--muted)} .bands .v{font-weight:600} .bands .n{color:var(--muted);font-size:13px;text-align:right}
.fq .gap{font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.top h1{margin:0;font-size:18px;font-weight:600;line-height:1.2;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}

.controls{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer;font-size:14px;font-weight:500}
#days{display:grid;grid-template-columns:repeat(4,1fr)}
#days button{border-radius:10px;padding:6px 4px;text-align:center}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.time{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.time input,.time button{min-height:40px}
.time input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-variant-numeric:tabular-nums}
.time button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer}
.ctx{margin:0;color:var(--muted);font-size:13px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.card.c h2{color:var(--centro)} .card.b h2{color:var(--bairro)}
.card .route{margin:0;color:var(--muted);font-size:13px}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big{font-family:var(--font-num);font-weight:600;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.card.c .big{color:var(--centro)} .card.b .big{color:var(--bairro)}
.rel{font-weight:600;font-size:16px}
.meta{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.more{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.more li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.more li:last-child{border-bottom:0;padding-bottom:0}
.more .t{font-family:var(--font-num);font-weight:600;font-size:22px;width:60px}
.more .r{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
.empty{color:var(--muted);margin:0}

.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:4px;padding:1px 6px;line-height:1.5;white-space:nowrap}
.tag.tc{background:var(--centro-bg);color:var(--centro)}
.tag.uv{background:var(--uv-bg);color:var(--uv)} .tag.ac{background:var(--ac-bg);color:var(--ac)}
.soon{background:var(--ac-bg);color:var(--ac);border-radius:999px;padding:1px 9px;font-weight:700}
.tagd{font-size:12px;color:var(--muted)}

section.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:16px;font-weight:600}
.panel .sub{margin:0;color:var(--muted);font-size:13px}
.dirtabs{display:flex;gap:6px}
.dirtabs button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;cursor:pointer;font-weight:600}
.dirtabs button[aria-pressed="true"].c{background:var(--centro);color:var(--on-dir);border-color:var(--centro)}
.dirtabs button[aria-pressed="true"].b{background:var(--bairro);color:var(--on-dir);border-color:var(--bairro)}
.grid{display:flex;flex-direction:column;position:relative;max-height:360px;overflow-y:auto;overscroll-behavior:contain}
.hr{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.hr:first-child{border-top:0}
.hr .h{font-family:var(--font-num);font-weight:600;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.mins{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.m{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums;font-weight:500}
.m.past{opacity:.38} .m.off{opacity:.2}
.m.nx{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.m.nx .tag{background:transparent;color:inherit;padding:0}
.hr.now .h{text-decoration:underline;text-underline-offset:4px}

.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details{font-size:14px}
summary{cursor:pointer;font-weight:600;font-size:16px}
details p,details ul{margin:8px 0 0}
details ul{padding-left:18px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pills span{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:13px}
.foot{font-size:12px;color:var(--muted)}
.foot a{color:inherit}
@media (prefers-reduced-motion:no-preference){.big{transition:color .2s}}
</style>
</head>
<body>

<div class="wrap">
  <div class="lines" id="lines" role="group" aria-label="Linha de ônibus"></div>
  <header class="top">
    <div class="num" id="lnum"></div>
    <div>
      <h1 id="lname"></h1>
      <p id="lsub"></p>
    </div>
  </header>

  <div class="controls">
    <div class="seg" id="days" role="group" aria-label="Dia da semana">
      <button data-day="auto" aria-pressed="true">Hoje</button>
      <button data-day="util" aria-pressed="false">Dias úteis</button>
      <button data-day="sab" aria-pressed="false">Sábado</button>
      <button data-day="dom" aria-pressed="false">Domingo</button>
    </div>
    <div class="seg" id="filters" role="group" aria-label="Filtro de variante"></div>
    <div class="time">
      <label for="t">A partir das</label>
      <input type="time" id="t">
      <button id="tnow" type="button">Agora</button>
    </div>
    <p class="ctx" id="ctx"></p>
  </div>

  <div class="cards" id="cards"></div>

  <section class="panel" id="overview" hidden>
    <h2>Próximo ônibus de cada linha</h2>
    <div class="ovbar">
      <div class="seg" id="favseg" role="group" aria-label="Quais linhas mostrar">
        <button class="chip" data-o="fav" aria-pressed="false">★ Favoritas</button>
        <button class="chip" data-o="all" aria-pressed="true">Todas</button>
      </div>
      <div class="seg" id="sortseg" role="group" aria-label="Ordenar lista">
        <button class="chip" data-s="time" aria-pressed="true">Mais cedo primeiro</button>
        <button class="chip" data-s="line" aria-pressed="false">Por linha</button>
      </div>
    </div>
    <p class="sub">Toque na estrela para fixar uma linha e sentido. Toque na linha para abrir os detalhes. Vale o dia e o horário escolhidos acima.</p>
    <div class="ov" id="ov"></div>
  </section>

  <section class="panel" id="gridp">
    <h2>Grade completa</h2>
    <div class="dirtabs" id="dirtabs"></div>
    <p class="sub" id="gsub"></p>
    <div class="grid" id="grid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="panel" id="freq">
    <h2>Frequência</h2>
    <p class="sub" id="fqsub"></p>
    <div class="fqs" id="fqs"></div>
  </section>

  <section class="panel" id="itinp">
    <details>
      <summary>Itinerário e variantes</summary>
      <div id="itin"></div>
    </details>
  </section>

  <p class="foot" id="foot"></p>
</div>

const WEEKDAY=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const state={favs:new Set(),ovf:'all',view:'all',sort:'time',line:'128',day:'auto',f:'all',gdir:'C',time:''};
const L=()=>LINES[state.line];
try{
  const s=JSON.parse(localStorage.getItem('linhas-sjc')||'{}');
  if(s.view==='line')state.view='line';

  if(LINES[s.line]){state.line=s.line;state.gdir=L().dirs[0].k;
    if(L().dirs.some(d=>d.k===s.gdir))state.gdir=s.gdir;

}catch(e){}
state.ovf=state.favs.size?'fav':'all';
function save(){try{localStorage.setItem('linhas-sjc',JSON.stringify({view:state.view,line:state.line,f:state.f,gdir:state.gdir,favs:[...state.favs]}));}catch(e){}}
function test(d){
  if(state.f==='all')return true;
  const f=L().filters.find(x=>x.id===state.f);
  return !!f&&f.tags.includes(d.tag);
}

const cache={};
function deps(type,dir){
  const k=state.line+type+dir;if(cache[k])return cache[k];
  const o=L().data[type][dir],out=[];
  for(const h in o)for(const s of o[h])out.push({m:(+h)*60+(+s.slice(0,2)),tag:s.slice(2).trim()});
  out.sort((a,b)=>a.m-b.m);return cache[k]=out;
}
const pad=n=>String(n).padStart(2,'0');
const fmt=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
function spNow(){
  try{
    const p={};
    for(const x of new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(new Date()))p[x.type]=+x.value;
    return {h:p.hour%24,mi:p.minute,ds:Date.UTC(p.year,p.month-1,p.day)};
  }catch(e){
    const d=new Date(Date.now()-10800000);
    return {h:d.getUTCHours(),mi:d.getUTCMinutes(),ds:Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())};
  }
}
const typeOf=ms=>{const w=new Date(ms).getUTCDay();return w===0?'dom':w===6?'sab':'util';};
function ctx(){
  const n=spNow(),early=n.h<4,DAY=86400000;
  const base=early?n.ds-DAY:n.ds,nowMin=n.h*60+n.mi+(early?1440:0);
  let tm=null;
  if(/^\d{1,2}:\d{2}$/.test(state.time||'')){const [h,m]=state.time.split(':').map(Number);tm=h*60+m;if(h<4)tm+=1440;}
  const auto=state.day==='auto';
  return {auto,early,todayMs:n.ds,base,nowMin,tm,type:auto?typeOf(base):state.day,ref:tm!==null?tm:(auto?nowMin:0),rel:auto&&tm===null};
}
function upcoming(dir,c,limit){
  const out=[];
  const days=c.auto?8:1;
  for(let k=0;k<days&&out.length<limit;k++){
    const type=c.auto?typeOf(c.base+k*86400000):c.type;
    const dd=c.auto?c.base+k*86400000-c.todayMs:0;
    const dn=Math.round(dd/86400000);
    for(const d of deps(type,dir)){
      const m=d.m+k*1440;
      if(m<c.ref||!test(d))continue;
      out.push({m,tag:d.tag,dn,dt:c.auto?c.base+k*86400000:null});
      if(out.length>=limit)break;
    }
  }
  return out;
}
function relText(d,c){
  if(d.dn>=1)return d.dn===1?'amanhã':WEEKDAY[new Date(d.dt).getUTCDay()].replace('-feira','');
  if(!c.rel)return '';
  const x=d.m-c.ref;
  return x<=0?'agora':'em '+dur(x);
}
function relHtml(d,c){
  const t=relText(d,c);
  return (d.dn<1&&c.rel&&d.m-c.ref<=5)?'<span class="soon">'+t+'</span>':t;
}
function badge(dir,tag){
  if(!tag)return '';
  const t=L().tags[dir][tag];
  return '<span class="tag '+(t?t.c:'')+'">'+tag+'</span>';
}
function tagDesc(dir,tag){const t=L().tags[dir][tag];return t?'<span class="tagd">'+t.d+'</span>':'<span class="tagd">Itinerário principal</span>';}

function renderCards(c){
  let html='';
  for(const D of L().dirs){
    const dir=D.k,up=upcoming(dir,c,4);
    html+='<section class="card '+D.cls+'"><div class="ch"><div><h2>'+D.name+'</h2><p class="route">'+D.route+'</p></div>'+star(state.line,dir)+'</div>';
    if(!up.length){html+='<p class="empty">'+(state.f==='all'?'Sem partidas neste dia.':'Nenhuma partida com esse filtro.')+'</p></section>';continue;}
    const a=up[0];
    html+='<div class="next"><div class="big">'+fmt(a.m)+'</div><div class="meta"><div class="rel">'+relHtml(a,c)+'</div>'+
      '<div>'+badge(dir,a.tag)+' '+tagDesc(dir,a.tag)+'</div></div></div>';
    if(up.length>1){
      html+='<ol class="more">';
      for(const d of up.slice(1)){
        html+='<li><span class="t">'+fmt(d.m)+'</span>'+badge(dir,d.tag)+'<span class="r">'+relHtml(d,c)+'</span></li>';
      }
      html+='</ol>';
    }
    html+='</section>';
  }
  $('cards').innerHTML=html;
}
function renderGrid(c){
  const dir=state.gdir,list=deps(c.type,dir);
  const pastOn=state.day==='auto'||c.tm!==null;
  let nx=null;
  if(pastOn){for(const d of list){if(test(d)&&d.m>=c.ref){nx=d;break;}}}
  const byH={};
  for(const d of list){const h=Math.floor(d.m/60);(byH[h]=byH[h]||[]).push(d);}
  const curH=Math.floor(c.ref/60);
  let html='';
  for(const h in byH){
    html+='<div class="hr'+(pastOn&&+h===curH?' now':'')+'"><div class="h">'+pad(h%24)+'</div><div class="mins">';
    for(const d of byH[h]){
      let cls='m';
      if(!test(d))cls+=' off';else if(pastOn&&d.m<c.ref)cls+=' past';
      if(d===nx)cls+=' nx';
      html+='<span class="'+cls+'">'+pad(d.m%60)+(d.tag?badge(dir,d.tag):'')+'</span>';
    }
    html+='</div></div>';
  }
  const g=$('grid'),gk=state.line+dir+c.type+state.f+(c.tm===null?'':c.tm)+state.day,keep=(gk===window._gk)?g.scrollTop:null;
  g.innerHTML=html;window._gk=gk;
  if(keep!==null)g.scrollTop=keep;
  else{const m=g.querySelector('.m.nx');g.scrollTop=m?Math.max(0,m.closest('.hr').offsetTop-4):(pastOn&&list.length?g.scrollHeight:0);}
  $('gsub').textContent=list.length+' partidas · '+TYPE_LABEL[c.type]+(list.some(d=>d.m>=1440)?' · após a meia-noite, os horários continuam no fim da tabela (00h, 01h…)':'');
  const leg=Object.entries(L().tags[dir]).map(([k,v])=>'<div><span class="tag '+v.c+'">'+k+'</span><span>'+v.d+'</span></div>').join('');
  $('legend').innerHTML=Object.keys(L().tags[dir]).length?leg+'<div><span class="tagd">Sem sigla: itinerário principal.</span></div>':'<div><span class="tagd">Itinerário único, sem variantes.</span></div>';
}
function renderCtx(c){
  let s;

    const n=spNow(),base=c.base;
    s='Agora '+pad(n.h)+':'+pad(n.mi)+' · '+WEEKDAY[new Date(base).getUTCDay()]+' ('+TYPE_LABEL[c.type]+')';
    if(c.early)s+=' · madrugada do dia anterior';
  }else s='Tabela de '+TYPE_LABEL[c.type];
  if(c.tm!==null)s+=' · a partir das '+fmt(c.tm);

const $=id=>document.getElementById(id);
function renderLine(){

  $('dirtabs').innerHTML=l.dirs.map(d=>'<button class="'+d.cls+'" data-d="'+d.k+'" aria-pressed="'+(d.k===state.gdir)+'">'+d.name+'</button>').join('');

function ovRows(c){
  const kl=state.line,kf=state.f,rows=[];
  state.f='all';
  try{
    for(const k of Object.keys(LINES)){
      state.line=k;
      for(const D of L().dirs){
        const a=upcoming(D.k,c,1)[0];
        rows.push({k,D,a,tag:a&&a.tag?badge(D.k,a.tag):''});
      }
    }
  }finally{state.line=kl;state.f=kf;}
  return rows;
}
const destOf=D=>D.route.includes('→')?D.route.split('→')[1].trim():D.route.replace(/^Sentido /,'');
const origOf=D=>D.route.includes('→')?D.route.split('→')[0].trim():D.name;
const fkey=(k,d)=>k+'|'+d;
function star(k,d){const on=state.favs.has(fkey(k,d));return '<button class="star" data-fav="'+fkey(k,d)+'" aria-pressed="'+on+'" aria-label="Favoritar">'+(on?'★':'☆')+'</button>';}
function toggleFav(key){if(state.favs.has(key))state.favs.delete(key);else state.favs.add(key);save();render();}
function renderOverview(c){
  press('favseg','o',state.ovf);
  let rows=ovRows(c);
  const fav=r=>state.favs.has(fkey(r.k,r.D.k));
  if(state.ovf==='fav')rows=rows.filter(fav);
  if(state.sort==='time')rows.sort((x,y)=>(x.a?x.a.m:1e9)-(y.a?y.a.m:1e9));
  rows.sort((x,y)=>fav(y)-fav(x));
  if(!rows.length){$('ov').innerHTML='<p class="empty">Nenhuma favorita ainda. Toque na estrela de uma linha e sentido, em "Todas", para fixá-la aqui.</p>';return;}
  $('ov').innerHTML=rows.map(r=>'<div class="ovw"><button class="ovr" data-l="'+r.k+'" data-d="'+r.D.k+'"><span class="n">'+r.k+'</span>'+
    '<span class="d"><b>Para '+destOf(r.D)+'</b><span>'+r.D.name+(r.D.route.includes('→')?' · de '+origOf(r.D):'')+'</span></span>'+
    '<span class="tr">'+(r.a?'<span class="t '+r.D.cls+'">'+fmt(r.a.m)+'</span><span class="r">'+r.tag+relHtml(r.a,c)+'</span>':'<span class="t">—</span><span class="r">sem partidas</span>')+'</span></button>'+star(r.k,r.D.k)+'</div>').join('');
}
const BANDS=[['Manhã',0,600],['Meio do dia',600,960],['Tarde',960,1200],['Noite',1200,1e9]];
function dur(x){const h=Math.floor(x/60),m=x%60;return h?h+' h'+(m?' '+pad(m)+' min':''):m+' min';}
function renderFreq(c){
  $('fqsub').textContent=TYPE_LABEL[c.type][0].toUpperCase()+TYPE_LABEL[c.type].slice(1)+' · '+(state.f==='all'?'todas as partidas':'só as partidas do filtro')+' · partidas por hora e intervalo entre elas';
  let html='';
  for(const D of L().dirs){
    const list=deps(c.type,D.k).filter(test);
    html+='<div class="fq '+D.cls+'"><h3>'+D.name+'</h3>';
    if(list.length<2){html+='<p class="empty">'+(list.length?'Só 1 partida.':(state.f==='all'?'Sem partidas neste dia.':'Nenhuma partida com esse filtro.'))+'</p></div>';continue;}
    const h0=Math.floor(list[0].m/60),h1=Math.floor(list[list.length-1].m/60),cnt={};
    let mx=1;
    for(const d of list){const h=Math.floor(d.m/60);cnt[h]=(cnt[h]||0)+1;if(cnt[h]>mx)mx=cnt[h];}
    const many=h1-h0+1>14;
    html+='<div class="bars" role="img" aria-label="Partidas por hora">';
    for(let h=h0;h<=h1;h++){
      const n=cnt[h]||0;
      html+='<div class="b" title="'+pad(h%24)+'h: '+n+' partida'+(n===1?'':'s')+'"><div class="col"><i style="height:'+(n?Math.round(n/mx*100):0)+'%"></i></div><span>'+(many&&h%2?'':pad(h%24))+'</span></div>';
    }
    html+='</div><div class="bands">';
    for(const [name,a,b] of BANDS){
      const it=list.filter(d=>d.m>=a&&d.m<b);
      if(!it.length)continue;
      const avg=it.length>1?Math.round((it[it.length-1].m-it[0].m)/(it.length-1)):0;
      html+='<span class="k">'+name+'</span><span class="v">'+(avg?'a cada ~'+dur(avg):'1 partida')+'</span><span class="n">'+it.length+' partida'+(it.length===1?'':'s')+'</span>';
    }
    html+='</div>';
    let g=0,ga=0,gb=0;
    for(let i=1;i<list.length;i++){const x=list[i].m-list[i-1].m;if(x>g){g=x;ga=list[i-1].m;gb=list[i].m;}}
    html+='<div class="gap">Maior intervalo: <b>'+dur(g)+'</b> ('+fmt(ga)+' → '+fmt(gb)+')</div></div>';
  }
  $('fqs').innerHTML=html;
}
function render(){
  const c=ctx();
  renderCtx(c);
  if(state.view==='all')renderOverview(c);
  else{renderCards(c);renderFreq(c);renderGrid(c);}
}
function press(group,attr,val){
  for(const b of $(group).querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset[attr]===val));
}
const curLineKey=()=>state.view==='all'?'all':state.line;
$('lines').innerHTML='<button class="ag" data-l="all" aria-pressed="'+(state.view==='all')+'">Agora</button>'+Object.keys(LINES).map(k=>'<button data-l="'+k+'" aria-pressed="'+(state.view==='line'&&k===state.line)+'" aria-label="Linha '+k+'">'+k+'</button>').join('');
$('lines').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.l===curLineKey())return;
  if(b.dataset.l==='all')state.view='all';
  else{state.view='line';state.line=b.dataset.l;state.f='all';state.gdir=L().dirs[0].k;}
  press('lines','l',curLineKey());save();renderLine();render();});
$('ov').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.fav){toggleFav(b.dataset.fav);return;}
  state.view='line';state.line=b.dataset.l;state.f='all';state.gdir=b.dataset.d;
  press('lines','l',state.line);save();renderLine();render();window.scrollTo(0,0);});
$('cards').addEventListener('click',e=>{const b=e.target.closest('button[data-fav]');if(b)toggleFav(b.dataset.fav);});
$('favseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.ovf=b.dataset.o;render();});
$('sortseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.sort=b.dataset.s;press('sortseg','s',state.sort);render();});
$('days').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.day=b.dataset.day;press('days','day',state.day);render();});
$('filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.f=b.dataset.f;press('filters','f',state.f);save();render();});
$('dirtabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.gdir=b.dataset.d;press('dirtabs','d',state.gdir);save();render();});
$('t').addEventListener('input',e=>{state.time=e.target.value;render();});
$('tnow').addEventListener('click',()=>{state.time='';$('t').value='';render();});
renderLine();render();
setInterval(()=>{if(!document.hidden&&!state.time&&state.day==='auto')render();},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
</script>

</body>
