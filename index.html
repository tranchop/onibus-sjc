<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Linhas de Ônibus SJC</title>
<meta name="description" content="Próximos horários de ônibus em São José dos Campos, conforme os PDFs oficiais da Prefeitura.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0d">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Ônibus SJC">
<style>
/* Linguagem visual iOS: fonte do sistema (SF), cores de sistema com contraste AA, barra translúcida, título grande,
   segmented controls, listas agrupadas com separadores finos. Centro = azul, Bairro = vermelho (cores de sentido).
   Camadas: só a barra fixa usa z-index (20); o 1 dos segmented controls é local ao controle. */
:root{
  --bg:#f2f2f7; --surface:#fdfdfd; --surface2:#f2f2f7; --fg:#1c1c1e; --muted:#6c6c70;
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2); --thumb:#fdfdfd;
  --tint:#0058d0; --on-tint:#fdfdfd;
  --centro:#0058d0; --bairro:#d70015; --centro-ink:#004fbd; --bairro-ink:#b80012;
  --uv-ink:#196a2d; --ac-ink:#a52a00; --star:#c93400;
  --centro-t:rgba(0,88,208,.12); --uv-t:rgba(31,122,53,.12); --ac-t:rgba(201,52,0,.12);
  --glass:rgba(250,250,252,.45); --glass-solid:#f7f7fa; --glass-rim:rgba(255,255,255,.85); --glass-hi:rgba(255,255,255,.55); --lens:rgba(255,255,255,.8);
  --glass-shadow:0 12px 32px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.08); --bg-fade:rgba(242,242,247,.72);
  --bar:rgba(242,242,247,.78); --shadow-thumb:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --ease:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.23,1,.32,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0d; --surface:#1c1c1e; --surface2:#2c2c2e; --fg:#f2f2f7; --muted:#a1a1a8;
    --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34); --thumb:#636366;
    --tint:#409cff; --on-tint:#0b0b0d;
    --centro:#409cff; --bairro:#ff6961; --centro-ink:#6cb4ff; --bairro-ink:#ff8a84;
    --uv-ink:#30db5b; --ac-ink:#ffb340; --star:#ffb340;
    --centro-t:rgba(64,156,255,.2); --uv-t:rgba(48,219,91,.2); --ac-t:rgba(255,179,64,.2);
    --glass:rgba(40,40,44,.42); --glass-solid:#2c2c2e; --glass-rim:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.1); --lens:rgba(255,255,255,.17);
    --glass-shadow:0 12px 32px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35); --bg-fade:rgba(11,11,13,.72);
    --bar:rgba(11,11,13,.74); --shadow-thumb:0 3px 8px rgba(0,0,0,.32);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0d; --surface:#1c1c1e; --surface2:#2c2c2e; --fg:#f2f2f7; --muted:#a1a1a8;
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34); --thumb:#636366;
  --tint:#409cff; --on-tint:#0b0b0d;
  --centro:#409cff; --bairro:#ff6961; --centro-ink:#6cb4ff; --bairro-ink:#ff8a84;
  --uv-ink:#30db5b; --ac-ink:#ffb340; --star:#ffb340;
  --centro-t:rgba(64,156,255,.2); --uv-t:rgba(48,219,91,.2); --ac-t:rgba(255,179,64,.2);
  --glass:rgba(40,40,44,.42); --glass-solid:#2c2c2e; --glass-rim:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.1); --lens:rgba(255,255,255,.17);
    --glass-shadow:0 12px 32px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35); --bg-fade:rgba(11,11,13,.72);
    --bar:rgba(11,11,13,.74); --shadow-thumb:0 3px 8px rgba(0,0,0,.32);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.35;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
button,input{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;transition:opacity .2s,background-color .2s,transform .16s var(--ease-out)}
button:active{opacity:.55;transition:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}

/* Navegação flutuante em vidro. Aproximação web do Liquid Glass (não existe CSS oficial da Apple):
   desfoque + saturação do que passa por baixo, borda clara e brilho especular. O vidro fica só na camada
   de navegação; o conteúdo continua sólido para ler bem. */
.sentinel{height:1px;margin-bottom:-1px}
.glass{position:relative;background:var(--glass-solid);box-shadow:var(--glass-shadow),inset 0 0 0 .5px var(--glass-rim)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(190%) brightness(1.04);backdrop-filter:blur(14px) saturate(190%) brightness(1.04)}
}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,var(--glass-hi),transparent 45%),radial-gradient(110% 70% at 50% 135%,var(--glass-hi),transparent 60%)}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--glass-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}
.bar{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  bottom:max(12px,env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;padding:5px;border-radius:999px}
.lines{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;border-radius:999px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent)}
.lines::-webkit-scrollbar{display:none}
.lines button{flex:none;position:relative;scroll-snap-align:center;min-width:56px;height:48px;padding:0 14px;border:0;border-radius:999px;background:none;
  font-family:var(--font-round);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;
  transition:transform .18s var(--ease-out),background-color .2s,color .2s}
.lines button.ag{font-family:var(--font);font-weight:600;font-size:16px}
.lines button[aria-pressed="true"]{background:var(--lens);color:var(--tint);box-shadow:inset 0 0 0 .5px var(--glass-rim),0 1px 6px rgba(0,0,0,.08)}
.lines button:active{opacity:1;transform:scale(1.08)}
.sgc::before{box-shadow:var(--shadow-thumb),inset 0 0 0 .5px var(--glass-rim)}
@media (max-width:359px){.ovr{grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding-left:12px}.ovr .n{font-size:15px}.ovr .t{font-size:21px}.ovw .star{width:36px}.ovw+.ovw::before{left:62px}}
.edge{position:fixed;left:0;right:0;z-index:15;pointer-events:none}
.edge.top{top:0;height:calc(env(safe-area-inset-top,0px) + 24px);background:linear-gradient(var(--bg),transparent);opacity:0;transition:opacity .2s}
.edge.top.on{opacity:1}
.edge.bot{bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 84px);background:linear-gradient(to top,var(--bg-fade),transparent)}
.chip:active{transform:scale(.96)}

.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}

/* Título */
.top{display:flex;gap:12px;align-items:center}
.top .num{flex:none;display:grid;place-items:center;min-width:64px;height:52px;padding:0 14px;border-radius:18px;background:var(--tint);color:var(--on-tint);
  font-family:var(--font-round);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.top h1{margin:0;font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:3px 0 0;font-size:15px;color:var(--muted)}
.top.all h1{font-size:34px;line-height:1.1;letter-spacing:.01em}

/* Grupos (inset grouped) */
.group{background:var(--surface);border-radius:24px;overflow:hidden}
.group :focus-visible{outline-offset:-2px}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sec>h2{margin:4px 4px 0;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.note,.ctx,.foot,.legend{margin:0 4px;font-size:13px;color:var(--muted);line-height:1.4}
.ctx{margin-top:-12px}

/* Controles */
.controls{padding:14px 16px 0;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;height:36px;padding:0 14px;border:0;border-radius:18px;background:var(--fill);font-size:15px;font-weight:500}
.chip::after{content:'';position:absolute;inset:-4px 0}
.chip[aria-pressed="true"]{background:var(--tint);color:var(--on-tint);font-weight:600}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;margin:0 -16px;padding:4px 8px 4px 16px;border-top:.5px solid var(--sep)}
.trow label{white-space:nowrap}
.tval{display:flex;align-items:center;gap:2px;min-width:0}
.tval input{height:36px;min-width:96px;padding:0 12px;border:0;border-radius:999px;background:var(--fill);font-size:17px;font-variant-numeric:tabular-nums}
.link{height:44px;padding:0 8px;border:0;background:none;color:var(--tint);font-size:17px}

/* Segmented control */
.sm{display:none}
@media (max-width:359px){.lg{display:none}.sm{display:inline}}
.sgc{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);min-height:40px;padding:2px;border-radius:999px;background:var(--fill)}
.sgc::before{content:'';position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n,1));border-radius:999px;
  background:var(--thumb);box-shadow:var(--shadow-thumb);transform:translateX(calc(var(--i,0)*100%))}
.sgc.ready::before{transition:transform .28s var(--ease)}
.sgc button{position:relative;z-index:1;min-width:0;padding:0 6px;border:0;border-radius:999px;background:none;font-size:13px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgc button[aria-pressed="true"]{font-weight:600}
.dirtabs button::before{content:'';display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;vertical-align:1px;background:var(--centro)}
.dirtabs button.b::before{background:var(--bairro)}

/* Agora: lista de linhas */
.ovbar{display:flex;flex-wrap:wrap;gap:8px}
.ovbar .sgc{flex:1 1 150px}
.ovw{position:relative;display:flex;align-items:center}
.ovw+.ovw::before{content:'';position:absolute;top:0;left:76px;right:0;border-top:.5px solid var(--sep)}
.ovr{flex:1;min-width:0;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;margin:0;padding:11px 0 11px 16px;
  border:0;border-radius:0;background:none;text-align:left}
.ovr:active{opacity:1;background:var(--fill)}
.ovr .n{display:grid;place-items:center;height:30px;border-radius:999px;background:var(--fg);color:var(--surface);
  font-family:var(--font-round);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.ovr .d{display:flex;flex-direction:column;gap:1px;min-width:0}
.ovr .d b{font-weight:600;line-height:1.2;text-wrap:balance}
.ovr .d span{font-size:13px;color:var(--muted)}
.ovr .tr{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ovr .t{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ovr .t.c{color:var(--centro)} .ovr .t.b{color:var(--bairro)}
.ovr .r{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.star{flex:none;width:44px;height:44px;margin-right:4px;border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--star)}
#ov .empty{padding:16px}

/* Cartões por sentido */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.card{display:flex;flex-direction:column;min-width:0;padding:16px 18px 0;border-radius:24px;background:var(--surface);overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ch .star{margin:-10px -12px 0 0}
.card h2{margin:0;font-size:17px;font-weight:600}
.card.c h2{color:var(--centro)} .card.b h2{color:var(--bairro)}
.card .route{margin:2px 0 0;font-size:15px;color:var(--muted)}
.next{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:8px 0 14px}
.big{font-family:var(--font-display);font-weight:600;font-size:60px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card.c .big{color:var(--centro)} .card.b .big{color:var(--bairro)}
.meta{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.rel{font-size:17px;font-weight:600}
.more{list-style:none;margin:0 -18px;padding:0}
.more li{position:relative;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;font-variant-numeric:tabular-nums}
.more li::before{content:'';position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.more .t{min-width:64px;font-family:var(--font-display);font-weight:600;font-size:20px}
.more .r{margin-left:auto;text-align:right;font-size:15px;color:var(--muted)}
.empty{margin:0;padding:4px 0 16px;font-size:15px;color:var(--muted)}

/* Siglas e destaques */
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.45;white-space:nowrap}
.tag.tc{background:var(--centro-t);color:var(--centro-ink)}
.tag.uv{background:var(--uv-t);color:var(--uv-ink)} .tag.ac{background:var(--ac-t);color:var(--ac-ink)}
.soon{padding:1px 8px;border-radius:999px;background:var(--ac-t);color:var(--ac-ink);font-weight:600}
.tagd{font-size:13px;color:var(--muted)}

/* Grade completa */
.gbox{padding:12px 16px 0}
.gsub{margin:10px 0 2px;font-size:13px;color:var(--muted)}
.grid{position:relative;display:flex;flex-direction:column;max-height:380px;margin:0 -16px;padding:0 16px;overflow-y:auto;overscroll-behavior:contain}
.hr{position:relative;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;padding:10px 0}
.hr+.hr::before{content:'';position:absolute;top:0;left:0;right:-16px;border-top:.5px solid var(--sep)}
.hr .h{font-size:17px;font-weight:600;line-height:28px;color:var(--muted);font-variant-numeric:tabular-nums}
.hr.now .h{color:var(--tint)}
.mins{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.m{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.m.past{opacity:.35} .m.off{opacity:.2}
.m.nx{background:var(--tint);color:var(--on-tint);font-weight:600}
.m.nx .tag{padding:0;background:transparent;color:inherit}
.legend{display:flex;flex-direction:column;gap:6px}
.legend div{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}

/* Frequência */
.fqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.fq{display:flex;flex-direction:column;gap:12px;min-width:0;padding:16px 18px;border-radius:24px;background:var(--surface)}
.fq h3{margin:0;font-size:17px;font-weight:600}
.fq.c h3{color:var(--centro)} .fq.b h3{color:var(--bairro)}
.fq .empty{padding:0}
.bars{display:flex;align-items:stretch;gap:2px;height:76px}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.bars .col{flex:1;width:100%;min-height:0;display:flex;align-items:flex-end}
.bars i{display:block;width:100%;min-height:2px;border-radius:3px 3px 1px 1px}
.fq.c .bars i{background:var(--centro)} .fq.b .bars i{background:var(--bairro)}
.bars .b span{height:10px;font-size:10px;line-height:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.bands{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:baseline;font-size:15px;font-variant-numeric:tabular-nums}
.bands .k{color:var(--muted)} .bands .v{font-weight:600} .bands .n{font-size:13px;color:var(--muted);text-align:right}
.fq .gap{padding:10px 14px;border-radius:14px;background:var(--surface2);font-size:15px;font-variant-numeric:tabular-nums}

/* Itinerário (linha com chevron) */
.disc summary{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 18px 0 16px;list-style:none;cursor:pointer;font-weight:600}
.disc summary::-webkit-details-marker{display:none}
.disc summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s var(--ease-out)}
.disc[open] summary::after{transform:rotate(45deg)}
.dbody{padding:12px 16px 16px;border-top:.5px solid var(--sep);font-size:15px;line-height:1.45}
.dbody p,.dbody ul{margin:8px 0 0}
.dbody>:first-child{margin-top:0}
.dbody ul{padding-left:18px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pills span{padding:3px 10px;border-radius:999px;background:var(--fill);font-size:13px}
.foot a{color:inherit}

@media (hover:hover) and (pointer:fine){
  .lines button:not([aria-pressed="true"]):hover,.chip:not([aria-pressed="true"]):hover{background:var(--fill2)}
  .ovr:hover{background:var(--fill)}
  .link:hover{opacity:.75}
}
@media (prefers-reduced-motion:reduce){
  .sgc.ready::before,.disc summary::after,button{transition:none}
  .lines button:active,.chip:active{transform:none}
}
</style>
</head>
<body>
<div class="sentinel" id="sentinel"></div>
<div class="edge top" id="edgetop" aria-hidden="true"></div>
<div class="edge bot" aria-hidden="true"></div>
<nav class="bar glass" id="bar" aria-label="Linhas">
  <div class="lines" id="lines" role="group" aria-label="Linha de ônibus"></div>
</nav>

<main class="wrap">
  <header class="top" id="top">
    <div class="num" id="lnum"></div>
    <div>
      <h1 id="lname"></h1>
      <p id="lsub"></p>
    </div>
  </header>

  <div class="group controls">
    <div class="sgc" id="days" role="group" aria-label="Dia da semana">
      <button data-day="auto" aria-pressed="true">Hoje</button>
      <button data-day="util" aria-pressed="false"><span class="lg">Dias úteis</span><span class="sm">Úteis</span></button>
      <button data-day="sab" aria-pressed="false"><span class="lg">Sábado</span><span class="sm">Sáb.</span></button>
      <button data-day="dom" aria-pressed="false"><span class="lg">Domingo</span><span class="sm">Dom.</span></button>
    </div>
    <div class="chips" id="filters" role="group" aria-label="Filtro de variante"></div>
    <div class="trow">
      <label for="t">Horário</label>
      <span class="tval"><input type="time" id="t"><button id="tnow" type="button" class="link">Agora</button></span>
    </div>
  </div>
  <p class="ctx" id="ctx"></p>

  <div class="cards" id="cards"></div>

  const days=c.auto?8:1;
  for(let k=0;k<days&&out.length<limit;k++){
    const type=c.auto?typeOf(c.base+k*86400000):c.type;
    const dd=c.auto?c.base+k*86400000-c.todayMs:0;
    const dn=Math.round(dd/86400000);
    for(const d of deps(type,dir)){
      const m=d.m+k*1440;
      if(m<c.ref||!test(d))continue;
      out.push({m,tag:d.tag,dn,dt:c.auto?c.base+k*86400000:null});
      if(out.length>=limit)break;
    }
  }
  return out;
}
function relText(d,c){
  if(d.dn>=1)return d.dn===1?'amanhã':WEEKDAY[new Date(d.dt).getUTCDay()].replace('-feira','');
  if(!c.rel)return '';
  const x=d.m-c.ref;
  return x<=0?'agora':'em '+dur(x);
}
function relHtml(d,c){
  const t=relText(d,c);
  return (d.dn<1&&c.rel&&d.m-c.ref<=5)?'<span class="soon">'+t+'</span>':t;
}
function badge(dir,tag){
  if(!tag)return '';
  const t=L().tags[dir][tag];
  return '<span class="tag '+(t?t.c:'')+'">'+tag+'</span>';
}
function tagDesc(dir,tag){const t=L().tags[dir][tag];return t?'<span class="tagd">'+t.d+'</span>':'<span class="tagd">Itinerário principal</span>';}

function renderCards(c){
  let html='';
  for(const D of L().dirs){
    const dir=D.k,up=upcoming(dir,c,4);
    html+='<section class="card '+D.cls+'"><div class="ch"><div><h2>'+D.name+'</h2><p class="route">'+D.route+'</p></div>'+star(state.line,dir)+'</div>';
    if(!up.length){html+='<p class="empty">'+(state.f==='all'?'Sem partidas neste dia.':'Nenhuma partida com esse filtro.')+'</p></section>';continue;}
    const a=up[0];
    html+='<div class="next"><div class="big">'+fmt(a.m)+'</div><div class="meta"><div class="rel">'+relHtml(a,c)+'</div>'+
      '<div>'+badge(dir,a.tag)+' '+tagDesc(dir,a.tag)+'</div></div></div>';
    if(up.length>1){
      html+='<ol class="more">';
      for(const d of up.slice(1)){
        html+='<li><span class="t">'+fmt(d.m)+'</span>'+badge(dir,d.tag)+'<span class="r">'+relHtml(d,c)+'</span></li>';
      }
      html+='</ol>';
    }
    html+='</section>';
  }
  $('cards').innerHTML=html;
}
function renderGrid(c){
  const dir=state.gdir,list=deps(c.type,dir);
  const pastOn=state.day==='auto'||c.tm!==null;
  let nx=null;
  if(pastOn){for(const d of list){if(test(d)&&d.m>=c.ref){nx=d;break;}}}
  const byH={};
  for(const d of list){const h=Math.floor(d.m/60);(byH[h]=byH[h]||[]).push(d);}
  const curH=Math.floor(c.ref/60);
  let html='';
  for(const h in byH){
    html+='<div class="hr'+(pastOn&&+h===curH?' now':'')+'"><div class="h">'+pad(h%24)+'</div><div class="mins">';
    for(const d of byH[h]){
      let cls='m';
      if(!test(d))cls+=' off';else if(pastOn&&d.m<c.ref)cls+=' past';
      if(d===nx)cls+=' nx';
      html+='<span class="'+cls+'">'+pad(d.m%60)+(d.tag?badge(dir,d.tag):'')+'</span>';
    }
    html+='</div></div>';
  }
  const g=$('grid'),gk=state.line+dir+c.type+state.f+(c.tm===null?'':c.tm)+state.day,keep=(gk===window._gk)?g.scrollTop:null;
  g.innerHTML=html;window._gk=gk;
  if(keep!==null)g.scrollTop=keep;
  else{const m=g.querySelector('.m.nx');g.scrollTop=m?Math.max(0,m.closest('.hr').offsetTop-4):(pastOn&&list.length?g.scrollHeight:0);}
  $('gsub').textContent=list.length+' partidas · '+TYPE_LABEL[c.type]+(list.some(d=>d.m>=1440)?' · após a meia-noite, os horários continuam no fim da tabela (00h, 01h…)':'');
  const leg=Object.entries(L().tags[dir]).map(([k,v])=>'<div><span class="tag '+v.c+'">'+k+'</span><span>'+v.d+'</span></div>').join('');
  $('legend').innerHTML=Object.keys(L().tags[dir]).length?leg+'<div><span class="tagd">Sem sigla: itinerário principal.</span></div>':'<div><span class="tagd">Itinerário único, sem variantes.</span></div>';
}
function renderCtx(c){
  let s;
  if(state.day==='auto'){
    const n=spNow(),base=c.base;
    s='Agora '+pad(n.h)+':'+pad(n.mi)+' · '+WEEKDAY[new Date(base).getUTCDay()]+' ('+TYPE_LABEL[c.type]+')';
    if(c.early)s+=' · madrugada do dia anterior';
  }else s='Tabela de '+TYPE_LABEL[c.type];
  if(c.tm!==null)s+=' · a partir das '+fmt(c.tm);
  else if(state.day!=='auto')s+=' · a partir do primeiro horário';
  $('ctx').textContent=s;
}
const $=id=>document.getElementById(id);
function renderLine(){
  window._gk=null;
  const l=L(),all=state.view==='all';
  $('top').classList.toggle('all',all);$('lnum').hidden=all;
  if(all){$('lname').textContent='Próximos ônibus';$('lsub').textContent=Object.keys(LINES).length+' linhas · São José dos Campos';
    $('foot').innerHTML='Horários conforme os PDFs oficiais da Prefeitura de São José dos Campos. Abra cada linha para ver a data da tabela e as observações. Confira a tabela em feriados.';}
  else{$('lnum').textContent=l.num;$('lname').textContent=l.name;$('lsub').textContent=l.sub;$('foot').innerHTML=l.foot;}
  $('itin').innerHTML=l.itin;
  for(const id of ['cards','freq','gridp','itinp'])$(id).hidden=all;
  $('overview').hidden=!all;
  $('filters').hidden=all||!l.filters.length;
  $('filters').innerHTML=[{id:'all',label:'Todos'}].concat(l.filters).map(f=>'<button class="chip" data-f="'+f.id+'" aria-pressed="'+(f.id===state.f)+'">'+f.label+'</button>').join('');
  $('dirtabs').innerHTML=l.dirs.map(d=>'<button class="'+d.cls+'" data-d="'+d.k+'" aria-pressed="'+(d.k===state.gdir)+'">'+d.name.replace(/^Sentido /,'')+'</button>').join('');
  const LB=$('lines'),sel=LB.querySelector('[aria-pressed="true"]');if(sel&&LB.scrollTo)LB.scrollTo({left:sel.offsetLeft-(LB.clientWidth-sel.offsetWidth)/2,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  document.title=all?'Linhas de Ônibus SJC':l.num+' · Linhas de Ônibus SJC';
}
function ovRows(c){
  const kl=state.line,kf=state.f,rows=[];
  state.f='all';
  try{
    for(const k of Object.keys(LINES)){
      state.line=k;
      for(const D of L().dirs){
        const a=upcoming(D.k,c,1)[0];
        rows.push({k,D,a,tag:a&&a.tag?badge(D.k,a.tag):''});
      }
    }
  }finally{state.line=kl;state.f=kf;}
  return rows;
}
const destOf=D=>D.route.includes('→')?D.route.split('→')[1].trim():D.route.replace(/^Sentido /,'');
const origOf=D=>D.route.includes('→')?D.route.split('→')[0].trim():D.name;
const fkey=(k,d)=>k+'|'+d;
function star(k,d){const on=state.favs.has(fkey(k,d));return '<button class="star" data-fav="'+fkey(k,d)+'" aria-pressed="'+on+'" aria-label="Favoritar">'+(on?'★':'☆')+'</button>';}
function toggleFav(key){if(state.favs.has(key))state.favs.delete(key);else state.favs.add(key);save();render();}
function renderOverview(c){
  press('favseg','o',state.ovf);
  let rows=ovRows(c);
  const fav=r=>state.favs.has(fkey(r.k,r.D.k));
  if(state.ovf==='fav')rows=rows.filter(fav);
  if(state.sort==='time')rows.sort((x,y)=>(x.a?x.a.m:1e9)-(y.a?y.a.m:1e9));
  rows.sort((x,y)=>fav(y)-fav(x));
  if(!rows.length){$('ov').innerHTML='<p class="empty">Nenhuma favorita ainda. Toque na estrela de uma linha e sentido, em "Todas", para fixá-la aqui.</p>';return;}
  $('ov').innerHTML=rows.map(r=>'<div class="ovw"><button class="ovr" data-l="'+r.k+'" data-d="'+r.D.k+'"><span class="n">'+r.k+'</span>'+
    '<span class="d"><b>Para '+destOf(r.D)+'</b><span>'+(r.a&&r.tag?r.tag+' ':'')+(r.D.route.includes('→')?'de '+origOf(r.D):r.D.name)+'</span></span>'+
    '<span class="tr">'+(r.a?'<span class="t '+r.D.cls+'">'+fmt(r.a.m)+'</span><span class="r">'+relHtml(r.a,c)+'</span>':'<span class="t none">--:--</span><span class="r">sem partidas</span>')+'</span></button>'+star(r.k,r.D.k)+'</div>').join('');
}
const BANDS=[['Manhã',0,600],['Meio do dia',600,960],['Tarde',960,1200],['Noite',1200,1e9]];
function dur(x){const h=Math.floor(x/60),m=x%60;return h?h+' h'+(m?' '+pad(m)+' min':''):m+' min';}
function renderFreq(c){
  $('fqsub').textContent=TYPE_LABEL[c.type][0].toUpperCase()+TYPE_LABEL[c.type].slice(1)+' · '+(state.f==='all'?'todas as partidas':'só as partidas do filtro')+' · partidas por hora e intervalo entre elas';
  let html='';
  for(const D of L().dirs){
    const list=deps(c.type,D.k).filter(test);
    html+='<div class="fq '+D.cls+'"><h3>'+D.name+'</h3>';
    if(list.length<2){html+='<p class="empty">'+(list.length?'Só 1 partida.':(state.f==='all'?'Sem partidas neste dia.':'Nenhuma partida com esse filtro.'))+'</p></div>';continue;}
    const h0=Math.floor(list[0].m/60),h1=Math.floor(list[list.length-1].m/60),cnt={};
    let mx=1;
    for(const d of list){const h=Math.floor(d.m/60);cnt[h]=(cnt[h]||0)+1;if(cnt[h]>mx)mx=cnt[h];}
    const many=h1-h0+1>14;
    html+='<div class="bars" role="img" aria-label="Partidas por hora">';
    for(let h=h0;h<=h1;h++){
      const n=cnt[h]||0;
      html+='<div class="b" title="'+pad(h%24)+'h: '+n+' partida'+(n===1?'':'s')+'"><div class="col"><i style="height:'+(n?Math.round(n/mx*100):0)+'%"></i></div><span>'+(many&&h%2?'':pad(h%24))+'</span></div>';
    }
    html+='</div><div class="bands">';
    for(const [name,a,b] of BANDS){
      const it=list.filter(d=>d.m>=a&&d.m<b);
      if(!it.length)continue;
      const avg=it.length>1?Math.round((it[it.length-1].m-it[0].m)/(it.length-1)):0;
      html+='<span class="k">'+name+'</span><span class="v">'+(avg?'a cada ~'+dur(avg):'1 partida')+'</span><span class="n">'+it.length+' partida'+(it.length===1?'':'s')+'</span>';
    }
    html+='</div>';
    let g=0,ga=0,gb=0;
    for(let i=1;i<list.length;i++){const x=list[i].m-list[i-1].m;if(x>g){g=x;ga=list[i-1].m;gb=list[i].m;}}
    html+='<div class="gap">Maior intervalo: <b>'+dur(g)+'</b> ('+fmt(ga)+' → '+fmt(gb)+')</div></div>';
  }
  $('fqs').innerHTML=html;
}
function render(){
  const c=ctx();
  renderCtx(c);
  if(state.view==='all')renderOverview(c);
  else{renderCards(c);renderFreq(c);renderGrid(c);}
  document.querySelectorAll('.sgc').forEach(syncSeg);
}
function press(group,attr,val){
  for(const b of $(group).querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset[attr]===val));
  syncSeg($(group));
}
function syncSeg(el){
  if(!el.classList.contains('sgc'))return;
  const bs=[...el.querySelectorAll('button')];
  el.style.setProperty('--n',bs.length);
  el.style.setProperty('--i',Math.max(0,bs.findIndex(b=>b.getAttribute('aria-pressed')==='true')));
}
const curLineKey=()=>state.view==='all'?'all':state.line;
$('lines').innerHTML='<button class="ag" data-l="all" aria-pressed="'+(state.view==='all')+'">Agora</button>'+Object.keys(LINES).map(k=>'<button data-l="'+k+'" aria-pressed="'+(state.view==='line'&&k===state.line)+'" aria-label="Linha '+k+'">'+k+'</button>').join('');
$('lines').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.l===curLineKey())return;
  if(b.dataset.l==='all')state.view='all';
  else{state.view='line';state.line=b.dataset.l;state.f='all';state.gdir=L().dirs[0].k;}
  press('lines','l',curLineKey());save();renderLine();render();});
$('ov').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.fav){toggleFav(b.dataset.fav);return;}
  state.view='line';state.line=b.dataset.l;state.f='all';state.gdir=b.dataset.d;
  press('lines','l',state.line);save();renderLine();render();window.scrollTo(0,0);});
$('cards').addEventListener('click',e=>{const b=e.target.closest('button[data-fav]');if(b)toggleFav(b.dataset.fav);});
$('favseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.ovf=b.dataset.o;render();});
$('sortseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.sort=b.dataset.s;press('sortseg','s',state.sort);render();});
$('days').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.day=b.dataset.day;press('days','day',state.day);render();});
$('filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.f=b.dataset.f;press('filters','f',state.f);save();render();});
$('dirtabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.gdir=b.dataset.d;press('dirtabs','d',state.gdir);save();render();});
$('t').addEventListener('input',e=>{state.time=e.target.value;render();});
$('tnow').addEventListener('click',()=>{state.time='';$('t').value='';render();});
renderLine();render();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.sgc').forEach(e=>e.classList.add('ready'))));
if('IntersectionObserver' in window)new IntersectionObserver(([e])=>$('edgetop').classList.toggle('on',!e.isIntersecting)).observe($('sentinel'));
setInterval(()=>{if(!document.hidden&&!state.time&&state.day==='auto')render();},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
</script>
